<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AprendaFlix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f1f1;
            font-family: Arial, Helvetica, sans-serif;
        }

        .cad-card {
            max-width: 450px;
            margin: 70px auto;
            background-color: #0f0f0f; /* Preto igual ao perfil */
            padding: 35px;
            border-radius: 15px;
            color: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.25);
            text-align: center;
        }

        .marcaagua {
            font-size: 2rem;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 25px;
        }

        .form-control {
            background-color: #272727;
            border: 1px solid #444;
            color: white;
        }

        .form-control:focus {
            background-color: #303030;
        }

        .btn-red {
            background-color: #ff0000;
            color: white;
            border: none;
            font-size: 1.1rem;
        }

        .btn-red:hover {
            background-color: #cc0000;
        }
    </style>
</head>

<body>

<div class="cad-card">

    <div class="marcaagua">AprendaFlix</div>

    <h3 class="mb-4">Cadastro de Usuário</h3>

    <form method="post" action="cadas.jsp">

        <div class="mb-3 text-start">
            <label class="fw-bold">E-mail:</label>
            <input type="email" name="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3 text-start">
            <label class="fw-bold">Senha:</label>
            <input type="password" name="senha" id="senha" class="form-control" required>
        </div>

        <div class="mb-3 text-start">
            <label class="fw-bold">Nome de Usuário:</label>
            <input type="text" name="nome_usu" id="nome_usu" class="form-control" required>
        </div>

        <div class="mb-3 text-start">
            <label class="fw-bold">Nome de Exibição:</label>
            <input type="text" name="nome_exi" id="nome_exi" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-red w-100 mt-2">Cadastrar</button>
        <button type="reset" class="btn btn-secondary w-100 mt-2">Limpar</button>

    </form>

</div>

</body>
</html>
